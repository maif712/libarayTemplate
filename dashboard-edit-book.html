<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/dashboard-form.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Dashboard</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html">Overview</a></li>
                    <li><a href="dashboard-books.html" class="active">Books</a></li>
                    <li><a href="#">Members</a></li>
                    <li><a href="#">Settings</a></li>
                    <li><a href="index.html">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Edit Book</h1>
            </header>
            <section class="form-container">
                <form>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" value="The Great Gatsby" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" value="F. Scott Fitzgerald" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="5">The Great Gatsby, F. Scott Fitzgerald’s third book, stands as the supreme achievement of his career.</textarea>
                    </div>
                    <div class="form-group">
                        <label for="cover-image">Cover Image</label>
                        <input type="file" id="cover-image" accept="image/*">
                        <img id="image-preview" src="https://via.placeholder.com/150/0000FF/FFFFFF?text=Book" alt="Image Preview" style="max-width: 200px; margin-top: 1rem;"/>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Update Book</button>
                        <a href="dashboard-books.html" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="js/dashboard-form.js"></script>
</body>
</html>
