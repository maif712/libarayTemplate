<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/dashboard-sidebar.css">
    <link rel="stylesheet" href="css/dashboard-form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo"><i class="fas fa-book-open"></i> Admin Panel</a>
            </div>
            <div class="admin-profile">
                <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="Admin Avatar" class="admin-avatar">
                <div class="admin-details">
                    <span class="admin-name">John Doe</span>
                    <span class="admin-role">Administrator</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="dashboard-books.html" class="active"><i class="fas fa-book"></i> Books</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Members</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Edit Book</h1>
            </header>
            <section class="form-container">
                <form>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" value="The Great Gatsby" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" value="F. Scott Fitzgerald" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="5">The Great Gatsby, F. Scott Fitzgerald’s third book, stands as the supreme achievement of his career.</textarea>
                    </div>
                    <div class="form-group">
                        <label for="cover-image">Cover Image</label>
                        <input type="file" id="cover-image" accept="image/*">
                        <img id="image-preview" src="https://via.placeholder.com/150/0000FF/FFFFFF?text=Book" alt="Image Preview" style="max-width: 200px; margin-top: 1rem;"/>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Update Book</button>
                        <a href="dashboard-books.html" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="js/dashboard-form.js"></script>
</body>
</html>
