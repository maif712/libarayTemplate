<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Library Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo"><i class="fas fa-book-open"></i> Admin</a>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Overview</a></li>
                    <li><a href="dashboard-books.html"><i class="fas fa-book"></i> Books</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Members</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Dashboard Overview</h1>
                <div class="admin-info">
                    <span>Welcome, Admin</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>
            <section class="stats-cards">
                <div class="card">
                    <h3>Total Books</h3>
                    <p>1,250</p>
                </div>
                <div class="card">
                    <h3>Books Borrowed</h3>
                    <p>345</p>
                </div>
                <div class="card">
                    <h3>Members</h3>
                    <p>87</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
