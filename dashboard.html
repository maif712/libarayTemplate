<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Library Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/dashboard-sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo"><i class="fas fa-book-open"></i> Admin Panel</a>
            </div>
            <div class="admin-profile">
                <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="Admin Avatar" class="admin-avatar">
                <div class="admin-details">
                    <span class="admin-name">John Doe</span>
                    <span class="admin-role">Administrator</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="dashboard-books.html"><i class="fas fa-book"></i> Books</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Members</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Dashboard</h1>
            </header>
            <div class="dashboard-grid">
                <div class="grid-item chart-container">
                    <canvas id="booksChart"></canvas>
                </div>
                <div class="grid-item activity-feed">
                    <h2>Recent Activity</h2>
                    <ul>
                        <li>John Doe borrowed "The Great Gatsby".</li>
                        <li>Jane Smith registered as a new member.</li>
                        <li>"To Kill a Mockingbird" was returned.</li>
                    </ul>
                </div>
                <div class="grid-item quick-actions">
                    <a href="dashboard-add-book.html" class="quick-action-card">
                        <i class="fas fa-plus-circle"></i>
                        <span>Add New Book</span>
                    </a>
                    <a href="#" class="quick-action-card">
                        <i class="fas fa-user-plus"></i>
                        <span>Add New Member</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
