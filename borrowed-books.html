<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Borrowed Books - Library Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user-home.css">
    <link rel="stylesheet" href="css/borrowed-books.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="user-home.html">Library</a>
            </div>
            <ul>
                <li><a href="user-home.html">Home</a></li>
                <li><a href="#">Books</a></li>
                <li><a href="borrowed-books.html">My Borrowed Books</a></li>
                <li><span class="username">Welcome, User</span></li>
                <li>
                    <form action="index.html" method="post" class="logout-form">
                        <button type="submit" class="btn">Logout</button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="borrowed-books-list">
            <div class="container">
                <h2>My Borrowed Books</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Cover</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Date Borrowed</th>
                            <th>Due Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><img src="https://via.placeholder.com/80/0000FF/FFFFFF?text=Book" alt="Book 1"></td>
                            <td>The Great Gatsby</td>
                            <td>F. Scott Fitzgerald</td>
                            <td>2025-10-15</td>
                            <td>2025-11-15</td>
                            <td><button class="btn-return">Return</button></td>
                        </tr>
                        <tr>
                            <td><img src="https://via.placeholder.com/80/00FF00/FFFFFF?text=Book" alt="Book 3"></td>
                            <td>1984</td>
                            <td>George Orwell</td>
                            <td>2025-10-20</td>
                            <td>2025-11-20</td>
                            <td><button class="btn-return">Return</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Library Management System</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
