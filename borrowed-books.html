<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Borrowed Books - Library Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user-home.css">
    <link rel="stylesheet" href="css/borrowed-books.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="user-home.html"><i class="fas fa-book-open"></i> Library</a>
            </div>
            <ul>
                <li><a href="user-home.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fas fa-book"></i> Books</a></li>
                <li><a href="borrowed-books.html"><i class="fas fa-list"></i> My Borrowed Books</a></li>
            </ul>
            <div class="auth-buttons">
                <span class="username">Welcome, User</span>
                <form action="index.html" method="post" class="logout-form">
                    <button type="submit" class="btn btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </form>
            </div>
        </nav>
    </header>

    <main>
        <section class="borrowed-books-list">
            <div class="container">
                <h2>My Borrowed Books</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Cover</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Date Borrowed</th>
                            <th>Due Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><img src="https://via.placeholder.com/80/0000FF/FFFFFF?text=Book" alt="Book 1"></td>
                            <td>The Great Gatsby</td>
                            <td>F. Scott Fitzgerald</td>
                            <td>2025-10-15</td>
                            <td>2025-11-15</td>
                            <td><button class="btn-return">Return</button></td>
                        </tr>
                        <tr>
                            <td><img src="https://via.placeholder.com/80/00FF00/FFFFFF?text=Book" alt="Book 3"></td>
                            <td>1984</td>
                            <td>George Orwell</td>
                            <td>2025-10-20</td>
                            <td>2025-11-20</td>
                            <td><button class="btn-return">Return</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Library Management System</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
