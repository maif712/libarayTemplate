<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/dashboard-sidebar.css">
    <link rel="stylesheet" href="css/dashboard-books.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo"><i class="fas fa-book-open"></i> Admin Panel</a>
            </div>
            <div class="admin-profile">
                <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="Admin Avatar" class="admin-avatar">
                <div class="admin-details">
                    <span class="admin-name">John Doe</span>
                    <span class="admin-role">Administrator</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="dashboard-books.html" class="active"><i class="fas fa-book"></i> Books</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Members</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Manage Books</h1>
                <a href="dashboard-add-book.html" class="btn-primary"><i class="fas fa-plus"></i> Add New Book</a>
            </header>
            <div class="book-list">
                <div class="book-card">
                    <div class="book-card-info">
                        <h3>The Great Gatsby</h3>
                        <p>F. Scott Fitzgerald</p>
                        <span class="status-available">Available</span>
                    </div>
                    <div class="book-card-actions">
                        <a href="dashboard-edit-book.html" class="btn-edit"><i class="fas fa-edit"></i></a>
                        <button class="btn-delete"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div class="book-card">
                    <div class="book-card-info">
                        <h3>To Kill a Mockingbird</h3>
                        <p>Harper Lee</p>
                        <span class="status-borrowed">Borrowed</span>
                    </div>
                    <div class="book-card-actions">
                        <a href="dashboard-edit-book.html" class="btn-edit"><i class="fas fa-edit"></i></a>
                        <button class="btn-delete"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div class="book-card">
                    <div class="book-card-info">
                        <h3>1984</h3>
                        <p>George Orwell</p>
                        <span class="status-available">Available</span>
                    </div>
                    <div class="book-card-actions">
                        <a href="dashboard-edit-book.html" class="btn-edit"><i class="fas fa-edit"></i></a>
                        <button class="btn-delete"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
