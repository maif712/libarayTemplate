<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/dashboard-form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo"><i class="fas fa-book-open"></i> Admin</a>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Overview</a></li>
                    <li><a href="dashboard-books.html" class="active"><i class="fas fa-book"></i> Books</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Members</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1>Add New Book</h1>
                <div class="admin-info">
                    <span>Welcome, Admin</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>
            <section class="form-container">
                <form>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="5"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="cover-image">Cover Image</label>
                        <input type="file" id="cover-image" accept="image/*">
                        <img id="image-preview" src="#" alt="Image Preview" style="display: none; max-width: 200px; margin-top: 1rem;"/>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Book</button>
                        <a href="dashboard-books.html" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="js/dashboard-form.js"></script>
</body>
</html>
